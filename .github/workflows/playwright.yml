name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly run at 06:00 UTC to catch drift on the live site
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Cancel an in-progress run when the same branch is pushed again
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scans the full history, not just the diff - credentials were committed here
  # once before and only found by accident
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  # Lists the specs, never runs them - so no browsers, no credentials, and it
  # finishes in seconds on every PR. Warns if the sheet and the specs disagree.
  coverage:
    name: Automation coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate coverage report
        run: npm run coverage | tee coverage.log

      - name: Add coverage to the job summary
        run: |
          echo "### Automation coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'automatable cases|WARNING' coverage.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-report-${{ github.run_attempt }}
          path: reports/coverage/
          retention-days: 30

  # Deliberately a single runner. The site serves a bot-check interstitial to
  # datacenter IPs, so every additional concurrent runner is another chance of
  # being challenged. The suite finishes in ~6 minutes, which is not worth
  # trading for that flakiness.
  test:
    name: Run Playwright suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Bump the suffix when the browser set changes - the lockfile hash
          # alone would not notice
          key: playwright-3browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers and OS deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install OS deps only (browsers restored from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      - name: Run Playwright tests
        run: npx playwright test
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_USER_NAME: ${{ secrets.TEST_USER_NAME }}

      - name: Upload HTML and Excel report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            reports/playwright/
            reports/excel/
          retention-days: 30

      - name: Upload failure traces and screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ github.run_attempt }}
          path: reports/test-results/
          retention-days: 7
